<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f9f9f9; }
  a { color: #007bff; text-decoration: none; }
</style>
</head>
<body>
  <table width="100%" border="0" cellspacing="0" cellpadding="20" style="background-color: #f9f9f9;">
    <tr>
      <td align="center">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; border-radius: 8px; overflow: hidden; border: 1px solid #dee2e6;">
          <tr>
            <td align="center" style="background: linear-gradient(to right, #2c3e50, #34495e); padding: 25px 20px;">
              <a href="https://www.remotejobshive.com" target="_blank">
                <img src="https://www.remotejobshive.com/logo.png" alt="RemoteJobsHive Logo" style="max-width: 160px; display: block;">
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px; background-color: #ffffff; color: #1f2a44;">
              <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 16px;">Your Subscription is Active!</h1>
              <p style="font-size: 16px; color: #4b5563; margin: 0 0 16px;">Hi [User Name],</p>
              <p style="font-size: 16px; color: #4b5563; margin: 0 0 24px;">Thank you for your payment! Your HIVE-PRO subscription is now active, and you have full access to all job listings and premium features.</p>
              <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; padding: 20px; border-radius: 8px; margin: 24px 0;">
                <p style="font-size: 14px; color: #4b5563; margin: 0 0 8px;"><strong>Plan:</strong> [Plan Name]</p>
                <p style="font-size: 14px; color: #4b5563; margin: 0;"><strong>Valid Until:</strong> [End Date]</p>
              </div>
              <table border="0" cellspacing="0" cellpadding="0" width="100%">
                <tr>
                  <td align="center">
                    <a href="https://www.remotejobshive.com/login" target="_blank" style="font-size: 16px; color: #ffffff; background-color: #007bff; text-decoration: none; border-radius: 5px; padding: 12px 24px; display: inline-block; font-weight: bold;">Go to Your Dashboard</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 20px; text-align: center; font-size: 12px; color: #888888; background-color: #f8f9fa;">
              <p style="margin: 0;">&copy; 2025 RemoteJobsHive Ltd. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
