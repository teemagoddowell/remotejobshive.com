<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f9f9f9; }
  a { color: #007bff; text-decoration: none; }
</style>
</head>
<body>
  <table width="100%" border="0" cellspacing="0" cellpadding="20" style="background-color: #f9f9f9;">
    <tr>
      <td align="center">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; border-radius: 8px; overflow: hidden; border: 1px solid #dee2e6;">
          <tr>
            <td align="center" style="background: linear-gradient(to right, #2c3e50, #34495e); padding: 25px 20px;">
              <a href="https://www.remotejobshive.co" target="_blank">
                <img src="https://www.remotejobshive.co/logo.png" alt="RemoteJobsHive Logo" style="max-width: 160px; display: block;">
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px; background-color: #ffffff; color: #1f2a44;">
              <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 16px;">Hi [User Name], Your Job Digest is Here!</h1>
              <p style="font-size: 16px; color: #4b5563; margin: 0 0 24px;">We found [Job Count] new remote roles tailored to your preferences.</p>
              
              </td>
          </tr>
          <tr>
            <td style="padding: 20px; text-align: center; font-size: 12px; color: #888888; background-color: #f8f9fa;">
              <p style="margin: 0;">You're receiving this because you subscribed to job alerts.</p>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
